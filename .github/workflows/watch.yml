name: Odyssey IMAX Watcher

on:
  workflow_dispatch:          # triggered by cron-job.org every 5 min (or manually)

permissions:
  contents: write

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py

      - name: Commit state
        run: |
          git config user.name "watcher-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_events.json || true
          git diff --cached --quiet || git commit -m "update state [skip ci]"
          git push
